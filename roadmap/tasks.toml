body = """
Prove the descripex -> theoria integration path end-to-end as a throwaway spike (scratch branch, not productionized here), to de-risk the bundle and confirm the in-package module shape before building it.

Wire ONE annotated descripex module through theoria's 0.9-dev tool-integration layer:
1. `Theoria.Typespec.fetch/1` pulls the function's normalized `@spec` contract facts -- theoria uses the SAME `Code.Typespec.fetch_specs/1` descripex already calls in `enrich_with_specs/2`; confirm they agree on the same module.
2. Synthesize a `Theoria.Typespec.Contract` (or a `Theoria.Spec.Claim`) from the module's `__api__/0` declaration (params/returns).
3. Compare via `Theoria.Spec.Typespec.contract_compatibility/2` and summarize with `Theoria.Spec.Report`.

The integration layer (`Theoria.Obligation`, `Theoria.Spec`, `Theoria.Typespec`, `Theoria.Certificate`) is NOT in released theoria 0.8.0 -- it is 0.9-dev, main-only (first appears in commit e6b3cf8, 15 commits past v0.8.0). Run this spike against a local theoria clone / git ref; do NOT add a Hex dep yet.

Decision this spike must resolve and write down: which `api()` metadata maps cleanly onto theoria's spec vocabularies vs. what needs manual proof terms; the exact `Descripex.Theoria` module surface for task 30; and confirmation that an optional-dep-inside-descripex approach is sound. Output: a short decision note + go/no-go.
"""
created_at = "2026-06-18"
scored_at = "2026-06-18"

