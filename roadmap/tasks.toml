body = """
REQUIRES theoria >= 0.9.0 published to Hex.pm (the Spec/Obligation/Typespec/Certificate layer ships in 0.9, not in released 0.8.0). Keep pending until that release exists; the dep cannot be declared in a publishable descripex before then.

Build the integration inside descripex (single package, optional dep) per the spike's confirmed shape:
- Add `{:theoria, "~> 0.9", optional: true}` to mix.exs. descripex must compile and pass its full suite WITHOUT theoria present (single-dep design principle stays intact); the new module is inert unless theoria is loaded.
- `Descripex.Theoria.contract/1` (or similar) maps a module's `__api__/0` declaration to theoria's contract-fact shape.
- `Descripex.Theoria.report/1` compares that against the function's real `@spec` (via `Theoria.Typespec` + `Theoria.Spec.Typespec.contract_compatibility/2`) and returns a `Theoria.Spec.Report` flagging drift between the hand-written api() metadata and the typespec.
- A `mix descripex.verify <Module...>` task runs the report across annotated modules and exits non-zero on drift, so it is CI-usable.

Scope is the FREE structural tier: typespec-compatibility claims + Spec.Report. Kernel-checked `:checked` certificates (which need manual proof terms) are task 32, not here.
"""
created_at = "2026-06-18"
scored_at = "2026-06-18"

