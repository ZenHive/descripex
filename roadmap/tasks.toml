acceptance_criteria = ["A scratch prototype takes one annotated module and produces a Theoria.Spec.Report comparing its api() declaration against its @spec", "Confirms descripex enrich_with_specs and Theoria.Typespec read the same Code.Typespec source and agree on a shared module", "Decision note records the free-vs-needs-proof claim split, the Descripex.Theoria surface for task 30, and go/no-go"]
