[[task]]
id = 17
phase = 8
bundle = "backlog"
status = "superseded"
title = "Generate llms.txt from Manifest"
scores = { d = 1, b = 1, u = 1 }
body = "Rejected. ex_doc v0.40+ already generates llms.txt from @doc text, and api() generates rich @doc text. Every Descripex-annotated library already gets llms.txt via mix docs. App-specific llms.txt (like Strip0x's HTTP API docs) correctly lives in the app layer, not the library."

[[task]]
id = 18
phase = 8
bundle = "backlog"
status = "superseded"
title = "Generate OpenAPI 3.1 from Manifest"
scores = { d = 1, b = 1, u = 1 }
body = "Rejected. OpenAPI describes HTTP APIs (methods, paths, request/response bodies). Descripex describes Elixir function contracts — it has no concept of HTTP routing, methods, or status codes. The mapping requires app-specific context that only the consuming app knows. Strip0x.OpenAPI works because it adds routing context. This belongs in the app layer."

