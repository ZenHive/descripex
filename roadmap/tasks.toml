title = "Add public `emit_api/3` macro for compile-time / for-comprehension api declarations"
scores = { d = 2, b = 7, u = 8 }
acceptance_criteria = ["`emit_api/3` is a documented public macro; `import Descripex` in `__using__/1` exposes it (emit_api: 3).", "A test module declares an api via `emit_api/3` from inside a for-comprehension with variable opts; `__api__/0` returns the correct entry (name, param_order, hints) — proving the path `api/3` can't serve.", "`@doc` text + `@doc hints:` are emitted identically to the equivalent `api/3` call for literal opts (no schema: keys).", "Compile-time validation still fires for emit_api declarations: a wrong param name (or missing def) declared via `emit_api/3` raises `CompileError` at __before_compile__, same as `api/3`.", "Schema-footgun guard: `emit_api/3` raises `ArgumentError` at expansion if `opts` is a literal keyword-list AST (message points the caller to `api/3`, which would have run preprocess_schemas). This removes the common misuse where a literal `schema: float()` would land raw in hints. Variable-opts callers (the for-comprehension case) pass through; the @doc states they must pre-convert any `schema:` keys.", "CHANGELOG entry; minor version bump (emit_api/3 is additive)."]
out_of_scope = ["Making `api/3` itself tolerate variable opts (would require deferring preprocess_schemas to before_compile — separate, larger change).", "Schema preprocessing inside emit_api (explicitly skipped; caller pre-converts)."]
body = """
`api/3` runs `preprocess_schemas(opts)` at macro-expansion time, which calls
`Keyword.get/2` on the opts AST — so it ONLY works when `opts` is a literal
keyword-list AST. Callers that build opts inside a `for`-comprehension or any
macro-time variable (opts is then a `{:var, _, _}` AST node, not a list) cannot
use `api/3` — `preprocess_schemas` raises.

Real consumer gap: ccxt_client generates ~241 unified API declarations by
looping over `Unified.method_defs/0` and building per-method `api_opts` as a
compile-time variable. It cannot call `api/3`. ccxt_client carries a *vendored
fork* of descripex SOLELY to add this macro (`vendor/descripex`,
`override: true`) — it can't switch to the hex package until this ships.

Add `emit_api/3` as a PUBLIC macro: same emissions as `api/3` but skips
`preprocess_schemas/1` (caller pre-converts any `schema:` keys; for-comprehension
callers don't use them). Reference impl already proven in the vendor fork:

    defmacro emit_api(name, description, opts) do
      quote do
        @descripex_api_declarations {unquote(name), unquote(description), unquote(opts)}
        @doc Descripex.generate_doc(unquote(description), unquote(opts))
        @doc hints: Descripex.build_hints(unquote(description), unquote(opts))
      end
    end

Also add `emit_api: 3` to the `import Descripex` list in `__using__/1`.
`generate_doc/2` and `build_hints/2` are already public — no other surface change.

Retires the vendor fork: once released, ccxt_client's mix.exs swaps
`{:descripex, path: "vendor/descripex", override: true}` for the hex requirement
and replaces the fully-qualified `Descripex.emit_api/3` call with the imported form.
"""
implemented = "emit_api/3 public macro in lib/descripex.ex: same @doc/@doc hints:/@descripex_api_declarations emissions as api/3 but skips preprocess_schemas, so it accepts variable (for-comprehension) opts. Imported via __using__ (emit_api: 3). Guard raises ArgumentError on a literal keyword-list opts (steers to api/3, the schema-footgun mitigation). __before_compile__ validation still fires (shared accumulator). 5 tests in descripex_test.exs: for-comprehension round-trip, api/3-can't-serve (FunctionClauseError), emit==api identical doc+hints for literal opts, validation-fires (CompileError on wrong param name), literal-opts-rejected (ArgumentError). CHANGELOG + minor bump 0.10.0 -> 0.11.0. CLAUDE.md macro section documents it."
created_at = "2026-06-16"
scored_at = "2026-06-16"
done_at = "2026-06-16"
shipped_in = "0.11.0"

